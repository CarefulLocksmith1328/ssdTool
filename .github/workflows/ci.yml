name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-image-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ntfs-3g
        run: sudo apt-get update && sudo apt-get install -y ntfs-3g
      - name: Tests against real NTFS images
        run: |
          pip install pytest
          sudo -E env "PATH=$PATH" python -m pytest -v -p no:cacheprovider tests

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: End-to-end test on a real NTFS volume (VHD)
        run: python tests\windows_e2e.py
      - name: Build SSD-Datenretter.exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --console --uac-admin --name SSD-Datenretter --add-data "ssdtool\web;ssdtool\web" run.py
      - name: Smoke test of the EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SSD-Datenretter.exe -ArgumentList "--no-browser","--no-elevate","--port","8799" -PassThru -RedirectStandardOutput out.txt
          Start-Sleep -Seconds 8
          $html = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/).Content
          Stop-Process -Id $p.Id
          if ($html -notmatch "SSD-Datenretter") { Get-Content out.txt; throw "Frontend nicht erreichbar" }
      - uses: actions/upload-artifact@v4
        with:
          name: SSD-Datenretter-exe
          path: dist/SSD-Datenretter.exe
